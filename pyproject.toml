[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project]
name = "alphazetacchess"
version = "0.1.0"
description = "AlphaZeta Chinese Chess Engine"
dependencies = ["numpy"]

[project.optional-dependencies]
web = ["flask"]
dev = ["pytest"]


[tool.pytest.ini_options]
pythonpath = [
    "src"
]